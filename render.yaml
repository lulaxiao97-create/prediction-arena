# Render blueprint — one-click production deploy of the arena frontend.
#
# Render has no phone or card requirement on the free plan and runs the app on a
# plain Node runtime (`next start`), so no framework adapter sits between the
# build and the server. The committed `render.yaml` is the deploy contract: a
# blueprint deploy reads it instead of hand-entering settings in the dashboard.
services:
  - type: web
    name: prediction-arena
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /
    autoDeploy: true
    # Custom domains are part of the deploy contract, not a dashboard-only manual step. A
    # blueprint sync adds them and Render then validates the DNS records that Cloudflare
    # serves (see frontend/DEPLOY.md → "The production domain").
    domains:
      - predictionarena.online
      - www.predictionarena.online
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_ARENA_ADDRESS
        value: 0x961872d75ea6E7A2859B9b04C6C7B1C73CF510b5
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "8453"
      - key: NEXT_PUBLIC_BASE_RPC_URL
        value: https://mainnet.base.org
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        value: 41ec5b26b8200a989dcb0da5a1fc33d9
      - key: NEXT_PUBLIC_ARENA_DEPLOY_BLOCK
        value: "53150166"
      - key: NEXT_PUBLIC_AI_DEBATE
        value: "1"
      # WalletConnect / Reown domain verification. Leave unset to serve the committed
      # public/.well-known/walletconnect.txt; set it to the token the dashboard issues when a
      # new domain (custom or otherwise) has to be proven.
      # - key: WALLETCONNECT_DOMAIN_VERIFICATION
      #   value: <token from dashboard.reown.com>
      - key: NEXT_PUBLIC_SITE_URL
        value: https://predictionarena.online
      # Ops console (/admin). Public half gates the UI, server half gates the metrics API; neither
      # is a secret, and neither can move funds — settlement is a contract call from this wallet.
      - key: NEXT_PUBLIC_ADMIN_ADDRESSES
        value: 0x436b9d5e6fBd40eC93E881263bE53e59F8755Ba1
      - key: ADMIN_ADDRESSES
        value: 0x436b9d5e6fBd40eC93E881263bE53e59F8755Ba1
      # Board data is read at runtime from the branch the ops daemon commits to, so a market refresh
      # no longer needs a rebuild. Unset = the same default baked into /api/board.
      - key: BOARD_SOURCE_URL
        value: https://raw.githubusercontent.com/lulaxiao97-create/prediction-arena/main/frontend/public/pools.json
      # Rewarded ads (Watch-to-Earn). Publisher credentials come from the HypeLab dashboard;
      # until they are set the unit is disabled and no points can be earned.
      # - key: NEXT_PUBLIC_ADS_PROVIDER
      #   value: hypelab
      # - key: NEXT_PUBLIC_ADS_SCRIPT_URL
      #   value: https://<publisher-script-from-hypelab-dashboard>
      # - key: NEXT_PUBLIC_HYPELAB_PROPERTY_ID
      #   value: <property id>
      # - key: NEXT_PUBLIC_HYPELAB_PLACEMENT_ID
      #   value: <rewarded placement slug>
