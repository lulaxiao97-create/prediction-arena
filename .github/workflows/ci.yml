name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts · compile + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compile
        run: npx hardhat compile
      - name: Test
        run: npx hardhat test
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
        env: &frontend-env
          NEXT_PUBLIC_ARENA_ADDRESS: "0x961872d75ea6E7A2859B9b04C6C7B1C73CF510b5"
          NEXT_PUBLIC_CHAIN_ID: "8453"
          NEXT_PUBLIC_BASE_RPC_URL: "https://mainnet.base.org"
          NEXT_PUBLIC_ARENA_DEPLOY_BLOCK: "53150166"
          NEXT_PUBLIC_SITE_URL: "https://predictionarena.online"
          NEXT_PUBLIC_AI_DEBATE: "1"
          NEXT_PUBLIC_ADMIN_ADDRESSES: "0x436b9d5e6fBd40eC93E881263bE53e59F8755Ba1"
          NEXT_TELEMETRY_DISABLED: "1"

      # The money path, end to end: mocked wallet + mocked Base RPC against the real production
      # build. Catches the class of bug that reached the board twice (blank multiplier, disabled
      # submit) before it can ship.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke (wallet → market → bet → three stages)
        run: bun run test:e2e
        env:
          <<: *frontend-env
          ADMIN_ADDRESSES: "0x436b9d5e6fBd40eC93E881263bE53e59F8755Ba1"

  deploy:
    name: Deploy · Render
    needs: [contracts, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the production deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
