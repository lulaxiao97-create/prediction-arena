name: Captain bot

# The recruiting bot, hosted where the credential already is.
#
# A long-poll bot has to be running to answer, and the token lives in this repo's secrets — so this
# workflow exists for the case where no machine of ours is awake. **It is dispatch-only on purpose**:
# the operator box now runs the same bot from cron (`scripts/start-telegram-bot.sh`), and Telegram
# allows exactly one `getUpdates` consumer per token. Two of them fight, and the loser dies with
# `409 Conflict: terminated by other getUpdates request` — which looks like a crash and is not.
# Use this workflow only when the local daemon is down, and set TELEGRAM_LOCAL_ONLY=0 first.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "serve window in minutes"
        default: "25"

permissions:
  contents: read

concurrency:
  group: captain-bot
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the captain register
        uses: actions/cache/restore@v4
        with:
          path: .data/captains.json
          key: captains-${{ github.run_id }}
          restore-keys: |
            captains-

      - name: Serve (long-poll + scheduled captain push)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN is not in repo secrets — the bot cannot serve. Add it under Settings → Secrets." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          WINDOW="${MINUTES:-55}"
          if [ "$WINDOW" -gt 55 ]; then WINDOW=55; fi
          # timeout, not a forever-loop: the job must end so the cache can be saved and the next
          # window can start. A crash mid-window is fine — the offset comes back from Telegram.
          timeout "${WINDOW}m" bun scripts/telegram-bot.ts --broadcast-every=15 || true

      - name: Register snapshot
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          {
            echo "## Captain register"
            echo '```'
            bun scripts/telegram-bot.ts --captains 2>&1 | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the captain register
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data/captains.json
          key: captains-${{ github.run_id }}
