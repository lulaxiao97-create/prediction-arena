name: Auto marketing

# Cloud-side content factory. Two slots a day, both `--pick=tribal`: the channel's job is to find a
# fight worth taking a side on, and the second slot deliberately lands on the *next* tribal market
# (auto-market skips whatever today's archive already featured) rather than reposting the morning's.
#
# The run is designed to be boring: if a channel is misconfigured the step still exits 0, prints the
# reason, and the next slot picks up. A red workflow every day trains everyone to ignore it, and
# then a real outage goes unnoticed for a week.

on:
  schedule:
    - cron: "10 9 * * *"
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      pick:
        description: "Which market to feature"
        type: choice
        options: [tribal, movers, expiry, tvl]
        default: tribal
      limit:
        description: "How many markets"
        default: "1"

permissions:
  contents: write

concurrency:
  group: auto-marketing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PICK="${{ inputs.pick }}"
            LIMIT="${{ inputs.limit }}"
          else
            # Both scheduled slots are tribal. The no-repeat rule lives in auto-market.ts (it skips
            # ids already in today's archive), so 17:10 lands on the next fight, not a repost.
            PICK="tribal"; LIMIT="1"
          fi
          echo "pick=$PICK" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "running pick=$PICK limit=$LIMIT"

      - name: Refresh tribal attribution
        # Feeds `--pick=tribal`: which tribe actually drew the most USDC on-chain. Best effort — if
        # the RPC throttles, the previous attribution (or the hand-tuned prior) still ranks the board
        # and the run continues. Never let a metrics refresh block the day's post.
        run: bun scripts/sync-attribution.ts || echo "attribution sync failed — keeping the previous weights"

      - name: Generate and publish
        env:
          # OAuth 1.0a user context — the only credential that can publish.
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Read-only fallback; the script prefers OAuth 1.0a when the four keys exist.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_SITE_URL: https://predictionarena.online
        run: |
          bun scripts/auto-market.ts \
            --pick=${{ steps.slot.outputs.pick }} \
            --limit=${{ steps.slot.outputs.limit }} \
            --write \
            --send | tee /tmp/run.log

      - name: Publish Farcaster casts to /base and /degen
        # Farcaster is the channel with no follower gate: a frame in /base reaches the timeline
        # directly. No signer is configured yet, so this prints `skipped — no signer` and moves on;
        # the moment NEYNAR_API_KEY + NEYNAR_SIGNER_UUID land in secrets it starts casting, with no
        # code change. Never fails the run: a blocked channel must not redden the day's post.
        env:
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_SIGNER_UUID: ${{ secrets.NEYNAR_SIGNER_UUID }}
          FARCASTER_BEARER: ${{ secrets.FARCASTER_BEARER }}
          NEXT_PUBLIC_SITE_URL: https://predictionarena.online
        run: bun scripts/farcaster-auto-cast.ts --publish 2>&1 | tee /tmp/casts.log || true

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Auto marketing — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo '```'
            tail -n 40 /tmp/run.log || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the archive
        run: |
          if [ -z "$(git status --porcelain docs/campaigns)" ]; then
            echo "no new copy to archive"
            exit 0
          fi
          git config user.name "auto-marketing[bot]"
          git config user.email "auto-marketing@users.noreply.github.com"
          git add docs/campaigns
          git commit -m "chore(campaigns): daily copy archive $(date -u +%Y-%m-%d)"
          git push

      - name: Upload copy for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaigns-${{ github.run_id }}
          path: docs/campaigns
          retention-days: 14
          if-no-files-found: ignore
